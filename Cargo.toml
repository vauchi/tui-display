[package]
name = "vauchi-tui-display"
version = "0.4.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Terminal display shell for the Vauchi presentation contract"

[dependencies]
vauchi-contract = { git = "https://gitlab.com/vauchi/contract.git", tag = "v0.99.0", version = "=0.99.0" }
ratatui-core = { version = "0.1.2", default-features = false, features = ["std", "layout-cache", "underline-color"] }
ratatui-widgets = { version = "0.3.2", default-features = false, features = ["std", "unstable-rendered-line-info"] }
crossterm = "0.28"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"

[dev-dependencies]
tempfile = "3"

# Development profile: fast builds, backtraces work (matches core)
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Test profile: skip full debug info, reduce binary size ~60%
[profile.test]
debug = "line-tables-only"
split-debuginfo = "off"
